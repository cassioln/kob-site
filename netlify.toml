# Kriativos On Board | Configuração Netlify
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/hero-frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[redirects]]
  from = "/api/create-pix-order"
  to = "/.netlify/functions/create-pix-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/mercadopago-webhook"
  to = "/.netlify/functions/mercadopago-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/bus-registration-status"
  to = "/.netlify/functions/bus-registration-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/bus-payment-proof"
  to = "/.netlify/functions/bus-payment-proof"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
