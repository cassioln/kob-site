name: Deploy via FTP - Locaweb

on:
  push:
    branches:
      - main
    # Estes arquivos não alteram o site servido pela Locaweb.
    paths-ignore:
      - '.github/workflows/**'
      - '.codex/**'
      - '.agents/**'
      - 'analytics/**'
      - 'server/**'
      - 'tests/**'
      - 'test/**'
      - 'docs/**'
      - '**/*.md'
      - 'playwright*.mjs'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: locaweb-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy do Site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Preparar cliente FTP
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y lftp

      - name: Validar seleção dos arquivos de publicação
        run: |
          python3 .github/scripts/test-deploy-assets.py
          python3 .github/scripts/test-deploy-ftp.py

      # O HTML só ganha novas versões de cache após os arquivos estarem no ar.
      - name: Preparar arquivos referenciados pelo HTML
        id: deploy_assets
        env:
          KOB_DEPLOY_BEFORE: ${{ github.event.before }}
        run: python3 .github/scripts/deploy-assets.py

      - name: Enviar arquivos antes do HTML
        if: steps.deploy_assets.outputs.has_assets == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/deploy-ftp.py assets

      - name: Confirmar arquivos públicos antes do HTML
        if: steps.deploy_assets.outputs.has_assets == 'true'
        run: python3 .github/scripts/deploy-assets.py --verify

      - name: FTP Deploy Locaweb
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/deploy-ftp.py site
