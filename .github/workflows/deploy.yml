name: Deploy via FTP - Locaweb

on:
  push:
    branches:
      - main
    # Estes arquivos não alteram o site servido pela Locaweb.
    paths-ignore:
      - '.github/workflows/**'
      - '.codex/**'
      - '.agents/**'
      - 'analytics/**'
      - 'server/**'
      - 'tests/**'
      - 'test/**'
      - 'docs/**'
      - '**/*.md'
      - 'playwright*.mjs'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: locaweb-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy do Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validar seleção dos arquivos de publicação
        run: python3 .github/scripts/test-deploy-assets.py

      # O HTML só ganha novas versões de cache após os arquivos estarem no ar.
      - name: Preparar arquivos referenciados pelo HTML
        id: deploy_assets
        env:
          KOB_DEPLOY_BEFORE: ${{ github.event.before }}
        run: python3 .github/scripts/deploy-assets.py

      - name: Enviar arquivos antes do HTML
        if: steps.deploy_assets.outputs.has_assets == 'true'
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: '.github/.deploy-assets'
          remoteDir: 'public_html'
          options: '--verbose'

      - name: Confirmar arquivos públicos antes do HTML
        if: steps.deploy_assets.outputs.has_assets == 'true'
        run: python3 .github/scripts/deploy-assets.py --verify

      - name: FTP Deploy Locaweb
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: '.'
          remoteDir: 'public_html' # Pasta padrão da Locaweb. Se o seu domínio usar outra pasta, altere aqui.
          options: >-
            --delete
            -x ^\.git/
            -x ^\.github/
            -x ^\.agents/
            -x ^\.hermes/
            -x ^\.hermes-tmp/
            -x ^\.impeccable/
            -x ^\.codex/
            -x ^\.worktrees/
            -x ^\.od-skills/
            -x ^\.playwright-mcp/
            -x ^bkp/
            -x ^assets/images/creators/
            -x ^analytics/
            -x ^server/
            -x ^api/
            -x ^netlify/
            -x ^php/db/
            -x ^loop_finder/
            -x ^node_modules/
            -x ^tests?/
            -x ^docs/superpowers/
            -x ^README\.md$
            -x ^PRODUCT\.md$
            -x ^DESIGN\.md$
            -x ^ONIBUS-PAGAMENTO\.md$
            -x ^ANALYTICS-PREREQUISITES\.md$
            -x ^preview\.sh$
            -x ^netlify\.toml$
            -x ^vercel\.json$
            -x ^playwright.*\.mjs$
            -x ^package\.json$
            -x ^package-lock\.json$
            -x ^\.env.*$
            -x ^\.gitignore$
            -x \.artifact\.json$
            -x \.DS_Store$
