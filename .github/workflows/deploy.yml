name: Deploy via FTP - Locaweb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy do Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: FTP Deploy Locaweb
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: '.'
          remoteDir: 'public_html' # Pasta padrão da Locaweb. Se o seu domínio usar outra pasta, altere aqui.
          options: >-
            --delete
            -x ^\.git/
            -x ^\.github/
            -x ^\.hermes/
            -x ^\.worktrees/
            -x ^\.od-skills/
            -x ^\.playwright-mcp/
            -x ^bkp/
            -x ^assets/images/creators/
            -x ^README\.md$
            -x ^PRODUCT\.md$
            -x ^DESIGN\.md$
            -x ^preview\.sh$
            -x ^netlify\.toml$
            -x ^vercel\.json$
            -x ^\.gitignore$
            -x \.artifact\.json$
            -x \.DS_Store$
