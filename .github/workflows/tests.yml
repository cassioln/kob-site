name: Testes

# Check obrigatório enxuto: servidor, contratos e onze fluxos essenciais.
# A suíte completa continua disponível localmente por npm test.
# Não usar paths-ignore aqui: o check obrigatório precisa concluir em todo PR.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Um push novo no PR cancela a rodada anterior, que já ficou desatualizada.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Testes (servidor + navegador)
    # PR em rascunho não roda; roda ao marcar "Ready for review".
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      boarding-mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: kob_boarding_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar PHP para testar presença no MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: pdo_mysql, zip
          coverage: none

      - name: Validar persistência e concorrência da chamada
        env:
          KOB_BOARDING_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=kob_boarding_test;charset=utf8mb4'
        run: |
          php php/tests/bus-boarding.test.php
          php php/tests/registration-edit.test.php
          php php/tests/boarding-rollcall-pdf.test.php
          php php/tests/boarding-rollcall-xlsx.test.php

      - name: Cache do Chromium do Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # O comando reaproveita o browser em cache e instala as libs do runner.
      - name: Preparar Chromium
        run: npx playwright install --with-deps chromium

      - name: Validar publicação FTP
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y lftp
          python3 .github/scripts/test-deploy-assets.py
          python3 .github/scripts/test-deploy-ftp.py

      - name: Checagens essenciais
        run: npm run test:ci

      - name: Anexar capturas das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-falhas
          path: test-results/
          retention-days: 3
