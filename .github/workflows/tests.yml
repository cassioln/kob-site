name: Testes

# Check obrigatório enxuto: servidor, contratos e onze fluxos essenciais.
# A suíte completa continua disponível localmente por npm test.
# Não usar paths-ignore aqui: o check obrigatório precisa concluir em todo PR.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Um push novo no PR cancela a rodada anterior, que já ficou desatualizada.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Testes (servidor + navegador)
    # PR em rascunho não roda; roda ao marcar "Ready for review".
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Cache do Chromium do Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # O comando reaproveita o browser em cache e instala as libs do runner.
      - name: Preparar Chromium
        run: npx playwright install --with-deps chromium

      - name: Checagens essenciais
        run: npm run test:ci

      - name: Anexar capturas das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-falhas
          path: test-results/
          retention-days: 3
