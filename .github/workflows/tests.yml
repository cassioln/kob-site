name: Testes

# Roda as suítes do repositório em todo PR para a main. Na main, ative em
# Settings → Branches a regra "Require status checks to pass" com o check
# "Testes (servidor + navegador)" para o merge só liberar com tudo verde.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Um push novo no PR cancela a rodada anterior, que já ficou desatualizada.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Testes (servidor + navegador)
    # PR em rascunho não roda; roda ao marcar "Ready for review".
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Os testes de servidor executam trechos PHP; o runner já traz o PHP.
      - name: Conferir PHP
        run: php --version

      - name: Cache do Chromium do Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar o Chromium do Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar dependências de sistema do Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Testes do servidor
        run: npm run test:server

      # CI=true no Actions: o playwright.config.mjs já liga 1 retentativa e forbidOnly.
      - name: Testes de navegador (Playwright)
        run: npm run test:analytics -- --reporter=list,github

      - name: Anexar screenshots, vídeos e traces das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-falhas
          path: test-results/
          retention-days: 7
