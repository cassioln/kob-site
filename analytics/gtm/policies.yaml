publication:
  # Modelo de permissao (decisao de Cassio, 2026-07-15): autonomia TOTAL para
  # o agente montar/importar/editar workspace e rodar Preview. A UNICA parada
  # obrigatoria e pedir OK explicito antes de PUBLICAR no container live.
  agent_may_edit_workspace: true
  agent_may_import_container: true
  agent_may_run_preview: true
  automated: false
  publish_requires_explicit_approval: true
  human_reviewer: Cassio Lima
  human_publisher: Cassio Lima
  second_high_risk_approver: null
  require_preview: true
  require_semantic_diff: true
  require_debugview: true
  require_rollback_version: true
consent:
  control_event_prefixes: [cookie_]
  forward_control_events_to_ga4: false
  required_paths:
    - default_denied_before_google_tag
    - accepted_grants_analytics_only
    - restored_grants_analytics_only
    - denied_revokes_optional_storage
  prohibited_grants: [ad_storage, ad_user_data, ad_personalization]
event_forwarding:
  wildcard_trigger_allowed: false
  allowlist:
    - kob_section_view
    - view_item_list
    - select_item
    - view_item
    - kob_whatsapp_click
    - generate_lead
    - kob_faq_open
    - kob_content_expand
    - kob_virtual_tour_open
naming:
  google_tag: Google Tag - Config - Web
  ga4_event_prefix: GA4 - Event -
  custom_event_trigger_prefix: CE -
  data_layer_variable_prefix: DLV -
workspace:
  preferred_name: analytics/tracking-v1
  create_only_after_site_tests_pass: true
  publish: false  # publish so apos OK explicito de Cassio (publish_requires_explicit_approval)
live_gate:
  command: npm run test:analytics:live
  collection_requests: intercepted_and_aborted
  publication_requires_exit_zero: true
known_live_risks:
  - id: consent_restored_not_triggered
    severity: high
    status: confirmed_gcs_g100_expected_g101
  - id: google_tag_two_page_triggers
    severity: high
    status: ui_risk_runtime_single_page_view_verified_on_acceptance_path
  - id: custom_html_gtag_consent_warning
    severity: medium
    status: reviewed_decision_keep_necessary
    decision: keep
    classification: necessary
    rationale: >-
      As duas tags Custom HTML (tag_id 5 e 7) sao o unico mecanismo que
      estabelece o Consent Mode v2 no container. Tag 5 emite
      gtag('consent','default', analytics_storage=denied, ad_*=denied,
      wait_for_update=500) na inicializacao (gtm.js/init), antes da Google Tag.
      Tag 7 emite gtag('consent','update', analytics_storage=granted) no aceite
      (cookie_consent_accepted) e na restauracao (cookie_consent_restored).
      A Google Tag (__googtag) NAO emite consent default proprio
      (googtag_has_own_consent_default=false), logo NAO ha duplicidade de
      consent default. O aviso do GTM e generico (qualquer gtag() em Custom HTML
      dispara), nao indica conflito. Comportamento validado ao vivo:
      G100 na 1a visita, G101 apos aceite e apos reload restaurado.
      Remover as tags quebraria o Consent Mode. Decisao: MANTER.
